<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إرث IRTH — منتج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sand: #E9E2D5; --linen: #F0E8DC; --ink: #1A1A1A;
      --gold: #C9A86A; --madinah: #0E2B22;
    }
    body { background: var(--sand); font-family: 'DM Sans', sans-serif; color: var(--ink); overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 20px 48px; display: flex; align-items: center; justify-content: space-between;
      direction: ltr; backdrop-filter: blur(14px); background: rgba(233,226,213,.62);
      border-bottom: 1px solid rgba(201,168,106,.18);
    }
    .n-logo img { height: 32px; }
    .n-back {
      font-family: 'DM Sans', sans-serif; font-size: 11px;
      letter-spacing: .22em; text-transform: uppercase; color: var(--madinah);
      text-decoration: none; opacity: .65;
    }
    .n-back:hover { opacity: 1; color: var(--gold); }

    .hero {
      min-height: 100vh; padding: 130px 48px 80px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
      max-width: 1480px; margin: 0 auto;
    }
    .hero-img {
      background: var(--linen); aspect-ratio: 4/5;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      border: 1px solid rgba(201,168,106,.18);
    }
    .hero-img img { width: 100%; height: 100%; object-fit: cover; }
    .hero-info { padding: 40px 0; }
    .eyebrow {
      font-size: 10px; letter-spacing: .42em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 22px;
    }
    .ar-name {
      font-family: 'Noto Naskh Arabic', serif;
      font-size: clamp(46px, 6vw, 84px); font-weight: 500;
      color: var(--madinah); line-height: 1.1; margin-bottom: 14px;
    }
    .en-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      font-size: clamp(28px, 3vw, 42px); color: var(--ink);
      opacity: .65; margin-bottom: 32px;
    }
    .gold-rule {
      width: 80px; height: 1px; background: var(--gold);
      margin: 0 0 32px; opacity: .55; direction: ltr;
    }
    .desc-ar {
      font-family: 'Noto Naskh Arabic', serif;
      font-size: 16px; line-height: 1.85; color: var(--ink);
      opacity: .75; margin-bottom: 22px;
    }
    .desc-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; line-height: 1.75; color: var(--ink);
      opacity: .6; margin-bottom: 44px; direction: ltr;
    }
    .origin {
      font-size: 11px; letter-spacing: .28em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 40px; direction: ltr;
    }
    .order-btn {
      display: inline-flex; align-items: center; gap: 12px;
      background: var(--madinah); color: white;
      padding: 18px 44px; border-radius: 100px;
      font-family: 'Noto Naskh Arabic', serif; font-size: 15px;
      text-decoration: none; transition: background .3s;
    }
    .order-btn:hover { background: #1a4a3a; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; gap: 40px; padding: 110px 24px 60px; }
      nav { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="n-logo"><img src="assets/logo.svg" alt="إرث IRTH"></a>
    <a href="collection.html" class="n-back">← المجموعة</a>
  </nav>

  <section class="hero">
    <div class="hero-img" id="prod-img-wrap">
      <img id="prod-img" src="assets/dates-cream-linen.png" alt="">
    </div>
    <div class="hero-info">
      <div class="eyebrow">— Origin · المصدر</div>
      <h1 class="ar-name" id="prod-ar">التمور المجلّلة</h1>
      <div class="en-name" id="prod-en">Premium Dates</div>
      <div class="gold-rule"></div>
      <p class="desc-ar" id="prod-desc-ar">تمور عجوة ومجول من المدينة المنورة، تُختار يدويًا، غنية بالمغذيات، محاطة بعبوة إرث الفاخرة.</p>
      <p class="desc-en" id="prod-desc-en">Hand-selected Ajwa and Medjoul dates from Madinah's finest farms.</p>
      <div class="origin" id="prod-origin">— المدينة المنورة</div>
      <a href="mailto:hello@irth.co" class="order-btn"><span>اطلب الآن</span><span>↘</span></a>
    </div>
  </section>

  <script>
    // Read ?sku= param to switch product
    const params = new URLSearchParams(location.search);
    const sku = params.get('sku');
    const catalog = {
      'dates':    { ar: 'التمور المجلّلة', en: 'Premium Dates', origin: 'المدينة المنورة', img: 'assets/dates-cream-linen.png', descAr: 'تمور عجوة ومجول من المدينة المنورة.', descEn: 'Hand-selected Ajwa and Medjoul dates.' },
      'olive':    { ar: 'زيت الزيتون الفاخر', en: 'Artisan Olive Oil', origin: 'فلسطين · المغرب', img: 'assets/olive-oil-premium.jpg', descAr: 'بكر ممتاز، عصر بارد أول.', descEn: 'First cold-press extra virgin.' },
      'cinnamon': { ar: 'القرفة السيلانية', en: 'Ceylon Cinnamon', origin: 'سريلانكا', img: 'assets/cinnamon-powder.jpg', descAr: 'قرفة حقيقية من سريلانكا.', descEn: 'True Ceylon cinnamon, not cassia.' },
      'honey':    { ar: 'عسل السدر الملكي', en: 'Sidr Royal Honey', origin: 'اليمن · حضرموت', img: 'assets/sidr-honey.jpg', descAr: 'عسل سدر خام من وادي حضرموت.', descEn: 'Raw Sidr honey from Hadhramaut.' },
      'mint':     { ar: 'نعناع المدينة المجفّف', en: 'Madinah Dried Mint', origin: 'المدينة المنورة', img: 'assets/madinah-mint.jpg', descAr: 'نعناع مجفف بأشعة الشمس.', descEn: 'Sun-dried mint from Madinah.' },
      'oud':      { ar: 'زيت العود النقي', en: 'Pure Oud Oil', origin: 'كمبوديا · الهند', img: 'assets/oud-oil.jpg', descAr: 'زيت عود طبيعي.', descEn: 'Pure agarwood oil.' }
    };
    if (sku && catalog[sku]) {
      const p = catalog[sku];
      document.getElementById('prod-ar').textContent      = p.ar;
      document.getElementById('prod-en').textContent      = p.en;
      document.getElementById('prod-origin').textContent  = '— ' + p.origin;
      document.getElementById('prod-img').src             = p.img;
      document.getElementById('prod-desc-ar').textContent = p.descAr;
      document.getElementById('prod-desc-en').textContent = p.descEn;
    }
  </script>
</body>
</html>
